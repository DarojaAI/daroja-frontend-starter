name: Secret Scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (v8.18.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install gitleaks CLI directly. The `gitleaks/gitleaks-action@v2`
      # wrapper requires a license and has a stripped-down `args:` schema;
      # installing the CLI matches the pre-commit v8.18.0 pin without any
      # license friction. Version is pinned by SHA via the release tarball.
      - name: Download gitleaks v8.18.0
        run: |
          curl -sSL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `detect` uses the embedded ruleset (same one pre-commit uses).
          # `--redact` masks findings in the report. `--no-banner` keeps
          # log lines short. Exits non-zero on any finding -> CI fails.
          gitleaks detect --redact --no-banner --source .
