name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      # Stdlib surface changes (src/api/envelope.ts) must be gated by CI —
      # downstream projects pin their imports of these helpers.
      - 'src/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm type-check

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        # `pnpm test --run` is rejected by pnpm 9 ('Unknown option: run') —
        # pnpm does not forward bare flags to the script. Use `pnpm run`.
        run: pnpm run test --run

      - name: Build
        run: pnpm build
